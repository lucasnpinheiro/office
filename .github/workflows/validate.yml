name: validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: Validate marketplace
        # not --strict: the published CLI flags agent-office's mod-only "types" field as unknown
        run: claude plugin validate .
      - name: Validate hook/skill plugins (strict)
        run: |
          for p in plugins/personas plugins/learning plugins/laya; do claude plugin validate --strict "$p" || exit 1; done
      - name: Plugin directory profile (non-fatal)
        # What the official plugin directory would refuse (missing README/LICENSE, metadata). Informational:
        # the directory runs more checks than this, and agent-office's mod format needs a newer CLI.
        continue-on-error: true
        run: |
          rc=0
          for p in plugins/*; do claude plugin validate --strict --profile directory "$p" || rc=1; done
          exit $rc
      - name: Validate agent-office mod (non-fatal)
        # The mod format (hooks.json "modules", "types") needs a Claude Code build newer than the
        # public npm release; the published CLI reports it as an error. Informational until npm catches up.
        continue-on-error: true
        run: claude plugin validate --strict plugins/agent-office
      - name: Plugin tests (non-fatal)
        # Not blocking on purpose (AC-049 unmet): whether the CI image's CLI has `claude plugin test` and the
        # `claude-code/testing` runtime (newer than the public npm release) is unverified. When the subcommand
        # is missing the step says SKIPPED explicitly and never prints a pass (AC-050).
        continue-on-error: true
        run: |
          if claude plugin test --help >/dev/null 2>&1; then
            claude plugin test plugins/agent-office
          else
            echo "SKIPPED: 'claude plugin test' is not available in this CLI; agent-office tests did NOT run (not a pass)."
            echo "agent-office tests: SKIPPED (CLI has no 'plugin test')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Shell scripts parse
        run: |
          bash -n plugins/personas/hooks/model-router.sh
          sh -n plugins/laya/scripts/laya-mcp.sh
      - name: Router hook smoke test
        run: |
          out=$(echo '{"prompt":"fix a typo"}' | LAYA_API_URL=http://127.0.0.1:9 MODEL_ROUTER_LOG=off bash plugins/personas/hooks/model-router.sh)
          echo "$out" | grep -q 'model-router'
      - name: Sanitization check
        run: bash scripts/check-sanitized.sh
      - name: Installer dry run
        run: node bin/install.mjs --dry-run --all
      - name: Pack dry run
        run: npm pack --dry-run
